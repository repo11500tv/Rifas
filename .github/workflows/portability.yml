name: Portability checks

on:
  push:
    branches:
      - feature/portable-installation
  pull_request:
    paths:
      - 'deployment/**'
      - 'tests/test_portability.py'
      - '.github/workflows/portability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m compileall -q deployment tests/test_portability.py
      - name: Run portability suite
        run: python -m unittest discover -s tests -p 'test_portability.py' -v\n      - name: Run synthetic recovery safety tests\n        run: python -m unittest discover -s tests -p 'test_recovery_safety.py' -v
